<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Judit & Guillermo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #020617;
            --accent-pink: #fb7185;
            --accent-green: #34d399;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--primary-bg);
            color: white;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
        }

        /* --- 1. CAPA FONDO (ESTRELLAS) --- */
        .stars {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, white 1px, transparent 1.5px),
                radial-gradient(circle at 70% 50%, white 1px, transparent 1.5px),
                radial-gradient(circle at 40% 80%, white 1px, transparent 1.5px);
            background-size: 300px 300px;
            opacity: 0.4;
            z-index: 0;
        }

        /* --- 2. CONTENEDOR HERO --- */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        /* --- 3. SISTEMA DE MAPA Y COORDENADAS --- */
        .map-viewport {
            position: relative;
            /* En escritorio ocupa el ancho, en móvil el alto */
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-container {
            position: relative;
            /* Esto mantiene la proporción del mapa pase lo que pase */
            height: 100%;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* En móviles, permitimos que el mapa sea un poco más alto para que no se vea minúsculo */
        @media (max-aspect-ratio: 1/1) {
            .map-container {
                height: 70%; /* Ajusta este % para dar más o menos zoom en móvil */
            }
        }

        .map-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.3;
            filter: brightness(1.2) contrast(1.1);
        }

        /* --- 4. CAPAS DE EFECTO (SUNSET) --- */
        .sunset-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(255, 120, 80, 0.2) 0%,
                rgba(255, 160, 80, 0.1) 40%,
                transparent 70%,
                rgba(2, 6, 23, 0.8) 100%
            );
            pointer-events: none;
            z-index: 2;
        }

        /* --- 5. ELEMENTOS INTERACTIVOS (SVG Y PUNTOS) --- */
        .interactive-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
        }

        .flight-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .point {
            position: absolute;
            width: clamp(10px, 2vw, 14px);
            height: clamp(10px, 2vw, 14px);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            z-index: 10;
        }

        /* Coordenadas relativas al mapa (Ajustadas para un mapa estándar) */
        .argentina { left: 28%; top: 82%; background: var(--accent-pink); }
        .barcelona { left: 49%; top: 32%; background: var(--accent-green); cursor: pointer; }

        .point span {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- 6. TEXTO FIJO --- */
        .fixed-content {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 300;
        }

        /* --- POPUP --- */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .popup-content {
            background: white;
            color: #0f172a;
            width: min(800px, 100%);
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 768px) {
            .popup-content { grid-template-columns: 1fr; }
            .popup-img { height: 200px; }
        }

        .popup-img { width: 100%; height: 100%; object-fit: cover; }
        .popup-text { padding: 40px; text-align: center; }

        .rsvp-button {
            background: var(--primary-bg);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52,211,153, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(52,211,153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153, 0); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <section class="hero">
        <div class="map-viewport">
            <div class="map-container">
                <img src="images/world.svg" class="map-img">
                <div class="sunset-overlay"></div>

                <div class="interactive-layer">
                    <svg class="flight-svg" viewBox="0 0 1000 562.5">
                        <path id="pathAnim" d="M280,460 Q380,120 490,180" fill="none" />
                        <path d="M280,460 Q380,120 490,180" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="6,8" />
                        
                        <g>
                            <text font-size="24" fill="white" text-anchor="middle" dominant-baseline="central">&#9992;</text>
                            <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
                                <mpath href="#pathAnim" />
                            </animateMotion>
                        </g>
                    </svg>

                    <div class="point argentina"><span>Buenos Aires</span></div>
                    <div class="point barcelona pulse" id="barcelonaPoint"><span>Barcelona</span></div>
                </div>
            </div>
        </div>

        <div class="fixed-content">
            <p style="letter-spacing: 10px; opacity: 0.8; font-size: 0.8rem; margin-bottom: 5px;">SAVE THE DATE</p>
            <h1>Judit & Guillermo</h1>
        </div>
    </section>

    <div class="popup" id="popup">
        <div class="popup-content">
            <img src="images/image1.png" class="popup-img">
            <div class="popup-text">
                <h2>¡Nos casamos!</h2>
                <p>17 de Julio de 2027</p>
                <a href="https://forms.gle/mNn5QGhmMoPXfbsSA" target="_blank" class="rsvp-button">Confirmar asistencia</a>
                <br>
                <button id="closePopup" style="margin-top:20px; background:none; border:none; cursor:pointer; text-decoration:underline;">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const point = document.getElementById("barcelonaPoint");
        const popup = document.getElementById("popup");
        const closePopup = document.getElementById("closePopup");

        point.addEventListener("click", () => { popup.style.display = "flex"; });
        closePopup.addEventListener("click", () => { popup.style.display = "none"; });
        window.addEventListener("click", (e) => { if(e.target === popup) popup.style.display = "none"; });
    </script>
</body>
</html>
