<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Judit & Guillermo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #020617;
            --accent-pink: #fb7185;
            --accent-green: #34d399;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--primary-bg);
            color: white;
            overflow: hidden; /* Evita scroll innecesario en el hero */
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FONDO ESTRELLAS */
        .stars {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, white 0.5px, transparent 1.5px);
            background-size: 200px 200px;
            opacity: 0.2;
            z-index: 0;
        }

        /* EL TRUCO PARA EL CORTE EN MÓVIL:
           En lugar de object-fit: contain, usamos un mapa que se expande.
           Para que no se corte Buenos Aires, centraremos la imagen de forma que el Atlántico sea el eje.
        */
        .map-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .map-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Para que llene todo el móvil */
            object-position: 10% center; /* Ajustamos para que se vea más América del Sur en móvil */
            opacity: 0.25;
            filter: brightness(0.8) contrast(1.2);
        }

        /* SINCRONIZACIÓN SVG + MAPA:
           Para que los puntos no se muevan de la imagen al estirarse (cover), 
           el SVG debe tener las mismas dimensiones y el mismo object-fit.
        */
        .interactive-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* Usamos un contenedor con la misma proporción que el mapa original (ej. 16:9)
           centrado de la misma forma que el object-fit del mapa.
        */
        .coordinate-system {
            position: absolute;
            top: 50%;
            left: 19%; /* Debe coincidir con el object-position del mapa */
            width: 177.78vh; /* 16/9 de la altura */
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Ajustes para pantallas muy anchas (Desktop) */
        @media (min-aspect-ratio: 16/9) {
            .coordinate-system {
                width: 100vw;
                height: 56.25vw;
                left: 50%; /* En desktop centramos normal */
            }
            .map-img { object-position: center; }
        }

        /* SVG Trayectoria */
        .flight-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* PUNTOS GEOGRÁFICOS */
        .point {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }

        /* Coordenadas en el sistema 16:9 */
        .argentina { left: 29%; top: 78%; background: var(--accent-pink); }
        .barcelona { left: 49%; top: 38%; background: var(--accent-green); cursor: pointer; }

        .point span {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52,211,153, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(52,211,153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153, 0); }
        }

        /* TEXTO CENTRAL */
        .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            padding: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 10vw, 7rem);
            font-weight: 300;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* POPUP */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .popup-content {
            background: white;
            color: #0f172a;
            width: min(800px, 100%);
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 768px) {
            .popup-content { grid-template-columns: 1fr; }
            .popup-img { height: 200px; }
        }

        .popup-img { width: 100%; height: 100%; object-fit: cover; }
        .popup-text { padding: 40px; text-align: center; }

        .rsvp-button {
            background: var(--primary-bg);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="stars"></div>

<section class="hero">
    <div class="map-wrapper">
        <img src="images/world.svg" class="map-img">
    </div>

    <!-- Sistema de coordenadas sincronizado con el mapa 'cover' -->
    <div class="interactive-layer">
        <div class="coordinate-system">
            
            <svg class="flight-svg" viewBox="0 0 1000 562.5">
                <path id="flightPath" 
                      d="M290,438 Q400,160 490,212" 
                      fill="none" 
                      stroke="rgba(255,255,255,0.3)" 
                      stroke-width="2" 
                      stroke-dasharray="5,5" />
                
                <text font-size="24" fill="white">
                    <textPath href="#flightPath" startOffset="0%">
                        &#9992;
                        <animate attributeName="startOffset" from="0%" to="100%" dur="10s" repeatCount="indefinite" />
                    </textPath>
                </text>
            </svg>

            <div class="point argentina"><span>Buenos Aires</span></div>
            <div class="point barcelona pulse" id="barcelonaPoint"><span>Barcelona</span></div>
        </div>
    </div>

    <div class="content">
        <p style="letter-spacing: 8px; opacity: 0.8; font-size: 0.8rem;">SAVE THE DATE</p>
        <h1>Judit & Guillermo</h1>
    </div>
</section>

<div class="popup" id="popup">
    <div class="popup-content">
        <img src="images/image1.png" class="popup-img">
        <div class="popup-text">
            <h2>¡Nos casamos!</h2>
            <p>17 de Julio de 2027</p>
            <a href="https://forms.gle/mNn5QGhmMoPXfbsSA" target="_blank" class="rsvp-button">Confirmar asistencia</a>
            <br>
            <button id="closePopup" style="margin-top:20px; background:none; border:none; cursor:pointer; text-decoration:underline;">Cerrar</button>
        </div>
    </div>
</div>

<script>
    const point = document.getElementById("barcelonaPoint");
    const popup = document.getElementById("popup");
    const closePopup = document.getElementById("closePopup");

    point.addEventListener("click", () => { popup.style.display = "flex"; });
    closePopup.addEventListener("click", () => { popup.style.display = "none"; });
    window.addEventListener("click", (e) => { if(e.target === popup) popup.style.display = "none"; });
</script>

</body>
</html>
