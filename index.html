<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Save the Date - Judit & Guillermo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-blue: #020617;
            --accent-pink: #fb7185;
            --accent-green: #34d399;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            background-color: var(--space-blue);
            color: white;
            overflow: hidden;
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 1. CAPA FONDO: ESTRELLAS --- */
        .stars-background {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(1.2px 1.2px at 50px 100px, white, transparent),
                        radial-gradient(1px 1px at 200px 300px, white, transparent);
            background-size: 300px 300px; opacity: 0.3;
            animation: twinkle 5s infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.2; } to { opacity: 0.5; } }

        /* --- 2. HERO PRINCIPAL --- */
        .hero {
            position: relative; width: 100vw; height: 100vh; height: 100svh;
            display: flex; align-items: center; justify-content: center;
            z-index: 1;
            /* Sunset suave de fondo */
            background: linear-gradient(to bottom, #020617 0%, #1e1b4b 60%, rgba(255, 145, 77, 0.15) 100%);
        }

        /* --- CAPA 1: MAPA DE FONDO --- */
        .map-overlay {
            position: absolute; inset: 0; z-index: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .map-img {
            width: 100%; height: 100%;
            object-fit: cover; /* Mapa llena la pantalla */
            object-position: 45% center; /* Centra Atlántico */
            opacity: 0.25; filter: brightness(1.2) contrast(1.1);
        }

        /* --- CAPA 2: SVG INTEGRAL (Contiene todo) --- */
        .svg-container {
            position: absolute; inset: 0; z-index: 10;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        
        .master-svg {
            width: 100%; height: 100%;
            /* 'slice' asegura que el lienzo SVG se recorta igual que el mapa 'cover' */
            preserveAspectRatio: xMidYMid slice;
        }

        /* --- ESTILOS TEXTO SVG (¡ESTO ES LA SOLUCIÓN!) --- */
        .svg-text-group { text-anchor: middle; pointer-events: none; }
        
        /* Save the Date */
        .svg-mini-title {
            font-size: 14px; fill: rgba(255,255,255,0.7);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 8px; text-transform: uppercase;
        }

        /* Nombres */
        .svg-h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 80px; /* Tamaño base interno, escala automáticamente */
            font-weight: 300; fill: white;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Fecha */
        .svg-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px; fill: rgba(255,255,255,0.9);
            letter-spacing: 2px;
        }

        /* Nombres de ciudades */
        .svg-label { font-size: 14px; fill: white; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }

        /* --- POPUP (Sin cambios) --- */
        .popup {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .popup-content {
            background: white; color: #0f172a; width: min(800px, 100%);
            border-radius: 24px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr;
        }
        @media (max-width: 768px) { .popup-content { grid-template-columns: 1fr; } .popup-img { height: 180px; } }
        .popup-img { width: 100%; height: 100%; object-fit: cover; }
        .popup-text { padding: 30px; text-align: center; }
        .rsvp-btn {
            background: var(--space-blue); color: white; padding: 12px 30px;
            border-radius: 30px; text-decoration: none; display: inline-block; margin-top: 20px;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="stars-background"></div>

    <section class="hero">
        <div class="map-overlay">
            <img src="images/world.svg" class="map-img">
        </div>

        <div class="svg-container">
            <svg class="master-svg" viewBox="0 0 1000 600">
                
                <path id="flightPath" d="M250,480 Q400,80 550,220" fill="none" />
                
                <g class="svg-text-group">
                    <text x="500" y="270" class="svg-mini-title">SAVE THE DATE</text>
                    <text x="500" y="340" class="svg-h1">Judit & Guillermo</text>
                    <text x="500" y="390" class="svg-date">17 Julio 2027</text>
                </g>

                <path d="M250,480 Q400,80 550,220" fill="none" 
                      stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="6,8" />

                <g style="will-change: transform;">
                    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#flightPath" />
                    </animateMotion>
                    <path d="M-12,-6 L12,0 L-12,6 L-8,0 Z" fill="white" transform="scale(1.2)" />
                </g>

                <circle cx="250" cy="480" r="6" fill="#fb7185" />
                <text x="250" y="505" text-anchor="middle" class="svg-label">Buenos Aires</text>

                <g id="bcnGroup" style="cursor:pointer; pointer-events:all;">
                    <circle cx="550" cy="220" r="15" fill="rgba(52,211,153,0.3)">
                        <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="550" cy="220" r="6" fill="#34d399" />
                    <text x="550" y="245" text-anchor="middle" class="svg-label">Barcelona</text>
                </g>
            </svg>
        </div>
    </section>

    <div class="popup" id="popup">
        <div class="popup-content">
            <img src="images/image1.png" class="popup-img">
            <div class="popup-text">
                <h2>¡Nos casamos!</h2>
                <p>17 de Julio de 2027</p>
                <a href="https://forms.gle/mNn5QGhmMoPXfbsSA" target="_blank" class="rsvp-btn">Confirmar asistencia</a>
                <br>
                <button id="closePopup" style="margin-top:20px; background:none; border:none; cursor:pointer; text-decoration:underline;">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const bcn = document.getElementById("bcnGroup");
        const popup = document.getElementById("popup");
        const closePopup = document.getElementById("closePopup");

        // El clic se hace sobre el grupo SVG
        bcn.addEventListener("click", () => { popup.style.display = "flex"; });
        closePopup.addEventListener("click", () => { popup.style.display = "none"; });
        window.addEventListener("click", (e) => { if(e.target === popup) popup.style.display = "none"; });
    </script>
</body>
</html>
